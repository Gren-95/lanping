[package]
name = "lanping-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "Command line version of LanPing for scripts and cron."

[lints]
workspace = true

[[bin]]
name = "lanping-cli"
path = "src/main.rs"

[dependencies]
lanping-core = { path = "../lanping-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
