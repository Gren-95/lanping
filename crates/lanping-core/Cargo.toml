[package]
name = "lanping-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published until the name is checked on crates.io.
publish = false
description = "UI-free LAN scanning engine: host discovery, ports, names, vendors."

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "fs", "process", "io-util"] }
surge-ping = "0.9"
dns-lookup = "4"
ipnet = "2"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.5"
x509-parser = "0.18.1"
