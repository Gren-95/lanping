[package]
name = "lanping"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform LAN scanner with an Iced GUI."

[dependencies]
lanping-core = { path = "../lanping-core" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced_fonts = { version = "0.3", features = ["lucide"] }
rfd = "0.17.2"
