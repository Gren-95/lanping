# Read-only agent for testing. Every address may ask, which is fine for a lab container
# and wrong for anything else.
agentAddress udp:161

# SNMP v1 and v2c: the community is the only credential.
rocommunity lanping-test default

# SNMP v3, for trying a v3 client later: user "lanping" with authentication (SHA) and
# privacy (AES). The passwords must be at least eight characters.
createUser lanping SHA "lanping-auth-pass" AES "lanping-priv-pass"
rouser lanping priv

sysName     lanping-snmp-test
sysLocation LanPing test lab
sysContact  nobody@example.invalid
sysServices 72
