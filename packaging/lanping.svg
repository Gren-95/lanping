<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>LanPing</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232f52"/>
      <stop offset="1" stop-color="#0d1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <!-- The ping: rings spreading out from the scanner, fading with distance. -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#6c8cff" stroke-width="10" opacity="0.8"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#6c8cff" stroke-width="8" opacity="0.32"/>
  <!-- The LAN: links from the scanner to the devices that answered. -->
  <g stroke="#e7edf5" stroke-width="9" stroke-linecap="round">
    <line x1="128" y1="128" x2="193" y2="63"/>
    <line x1="128" y1="128" x2="60" y2="88"/>
    <line x1="128" y1="128" x2="128" y2="220"/>
  </g>
  <circle cx="193" cy="63" r="21" fill="#3fd29a"/>
  <circle cx="60" cy="88" r="18" fill="#f2b84b"/>
  <circle cx="128" cy="220" r="16" fill="#f26d6d"/>
  <circle cx="128" cy="128" r="28" fill="#e7edf5"/>
  <circle cx="128" cy="128" r="12" fill="#6c8cff"/>
</svg>
