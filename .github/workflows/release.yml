name: Release builds

# Pull requests that touch the packaging build the files without publishing them.
# A pushed tag such as v0.1.0 also attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - scripts/build-appimage.sh
      - scripts/build-macos-app.sh
      - packaging/**
      - crates/lanping/build.rs
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    # The oldest supported runner, so the AppImage runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build AppImage
        run: scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe
        run: cargo build --release -p lanping --locked
      - name: Name exe with the version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir dist
          cp target/release/lanping.exe "dist/LanPing-$version-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build app and disk image
        run: scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --notes-file .github/release-notes.md
